<div class="showcase-overlay">
  <p (click)="onOverlayTextClick()" class="showcase-overlay-text">
    {{ 'showcaseOverlay.text1' | translate }} <span> {{ 'showcaseOverlay.text2' | translate }}  </span> {{ (isOverlayVisible ? 'showcaseOverlay.text32' : 'showcaseOverlay.text31') | translate }}
  </p>
</div>

<div class="showcase-screen" [ngClass]="{hidden: !isOverlayVisible}">
  <showcase-screen/>
</div>
